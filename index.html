<style>
:root { --ink:#1d2127; --soft:#5a626c; --gold:#e3b23c; --bg:#f7f5f0; --line:#e6e1d4; --wa:#0f8a5f; }
* { box-sizing:border-box; }
body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; color:var(--ink); background:var(--bg); line-height:1.5; }
.wrap { max-width:1000px; margin:0 auto; padding:0 18px; }
.hero { background:var(--ink); color:#fff; text-align:center; padding:56px 0 64px; }
.logo { font-size:clamp(2.2rem,9vw,3.6rem); font-weight:800; letter-spacing:.1em; margin:0; }
.logo span { color:var(--gold); }
.tag { color:#c3c8ce; margin:10px 0 0; font-size:1.05rem; letter-spacing:.04em; }
.line { width:64px; height:4px; background:var(--gold); border-radius:2px; margin:22px auto 0; }
h2 { font-size:1.4rem; margin:0 0 16px; text-align:center; }
.contact { margin-top:-34px; display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
.box { background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px; text-align:center; box-shadow:0 6px 18px rgba(29,33,39,.08); }
.box small { display:block; color:var(--soft); letter-spacing:.08em; text-transform:uppercase; font-size:.78rem; }
.box strong { display:block; font-size:1.7rem; margin:4px 0 16px; letter-spacing:.02em; }
.btns { display:flex; gap:10px; }
.btn { flex:1; display:block; text-decoration:none; font-weight:700; padding:13px 10px; border-radius:10px; }
.wa { background:var(--wa); color:#fff; }
.call { background:var(--gold); color:var(--ink); }
section { padding:46px 0 0; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
.item { margin:0; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.item img { display:block; width:100%; height:auto; aspect-ratio:800/419; object-fit:cover; background:#e8e5dc; }
.item figcaption { padding:10px 12px; font-weight:600; font-size:.95rem; }
.address { background:var(--ink); color:#fff; border-radius:16px; padding:28px 22px; text-align:center; }
.address h2 { color:var(--gold); }
.address p { margin:0 0 18px; font-size:1.1rem; }
.address .btn { display:inline-block; width:auto; padding:13px 24px; }
footer { text-align:center; color:var(--soft); font-size:.88rem; padding:30px 0 36px; }
</style>
